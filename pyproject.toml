[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mot-slam"
version = "0.1.0"
description = "Stereo and IMU local mapping with moving-feature removal"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-contrib-python-headless>=4.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mot-slam = "mot_slam.cli:main"

[tool.setuptools.packages.find]
include = ["mot_slam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
